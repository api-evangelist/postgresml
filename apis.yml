name: PostgresML
description: >-
  PostgresML brings machine learning and AI into PostgreSQL. Using the open-source
  pgml extension it runs embedding generation, LLM inference, vector search, and
  classic supervised learning (regression, classification, clustering) directly
  inside the database, so applications index, filter, and rank vectors and generate
  fact-based, real-time outputs without operating a separate ML or vector stack.
  It is consumed as SQL over the Postgres wire protocol and through the first-party
  Korvus SDK (Python, JavaScript, Rust, and C bindings), which unifies the entire
  RAG pipeline into a single database query. PostgresML Cloud offers managed
  serverless and dedicated Postgres databases with the extensions pre-installed,
  and PgCat provides connection pooling, sharding, and failover. There is no
  REST/HTTP API; authentication is a standard PostgreSQL connection string.
  Backed by Amplify Partners.
